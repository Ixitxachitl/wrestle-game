<!doctype html>
<!--
  Chat Slam — OBS browser source
  ------------------------------
  A chatter types "!wrestle somebody" and a little pixel-art wrestling arena grows in along the bottom of the
  screen: a ring with turnbuckles and ropes under swaying spotlights, and a crowd on the bleachers behind it,
  holding up signs and taking photos. The two of them run in, leap over the top rope and square off, and the ref
  rings the bell. Then it's a little simulated match: dropkicks, clotheslines, hip tosses, body slams, suplexes
  and flying crossbodies off the top turnbuckle, with health bars, "WHAM!"s, a near fall or two ("1... 2...
  KICKOUT!") and finally the winner's own finishing move and the 3-count. The winner holds up the title belt in
  a shower of confetti; the loser lies there seeing stars. Nobody gets hurt. Then it all shrinks away, and
  there's nothing on screen until the next match. After a match there's a cooldown before the next one.

  Everything is a full 3D voxel model, seen flat on with no perspective, so it looks like 2D pixel art; only the
  floor and the mat show a little depth (the 2.5D look). Wrestlers wear a singlet in their chat color, and the
  same chatter always gets the same look (some get a luchador mask). Twitch chatters who have set pronouns with
  the Chat Pronouns extension get a look to match.

  OBS: Add > Browser, URL https://slam.ixitxachitl.com/?channel=yourchannel, at your canvas size (e.g.
       1920x1080). The background is transparent inside OBS.

  CONTROLS: in OBS, right-click this source → Interact and move the mouse over the overlay. The bar in the
  bottom-right corner starts a match between two names you type; the gear opens the settings. Every setting
  can also be a URL parameter, which overrides it.

  Chat (all read anonymously, no login needed):
    channel   Twitch channel          kick      Kick channel
    tiktok    TikTok bridge: 1 = TikFinity on this PC, or a ws:// address
    youtube   a live video ID or link (needs ytkey), or a ws:// bridge
    ytkey     YouTube Data API v3 key ytpoll    seconds between YouTube checks (default 6)
    demo      1 = fake chatters wrestle every so often, for trying it out
    firsttime 1 = show first-time chatters too (default 0: Twitch flags them, and spam bots usually show up that way)
    botlist   1 = leave out the ~1k known bots on the public TwitchInsights list (default 1)
    ignore    names to always leave out, comma separated (default: the usual chat bots)

  Matches:
    cmd       the command (default !wrestle). "!wrestle name" starts a match with that chatter; "!wrestle" on its
              own picks someone. You can only wrestle someone who has chatted in the last 10 minutes.
    cooldown  seconds after a match before the next one can start (default 60). The broadcaster skips it.
    modskip   1 = mods skip the cooldown too (default 0)
    who       who can start one besides the broadcaster: everyone (default), vips (mods and VIPs), mods or
              owner (only the broadcaster)
    allow     more names that can start one, comma separated
    pronouns  1 = look up Twitch chatters' pronouns at pronouns.alejo.io to pick their look (default 1)

  Look:
    title     the show's name on the ring apron (default CHAT SLAM)
    layout    box (default) = in a small box along the bottom of the screen, in the middle; wide = the whole screen
    boxsize   how wide the small box is, % of the screen (default 40)
    pixel     screen pixels per art pixel (default 0 = about 1/120 of the source's height: 9 at 1080p; in the box,
              whatever fills it)
    hold      seconds the winner stays up before it all goes away (default 5)
    volume    0-100 sound effects (default 50; 0 = silent)
    bg        testing: none = transparent in a normal browser too, or a color (default: dark outside OBS)

  Custom integrations (Streamer.bot, etc.) can call window.slam.start(challenger, opponent, { winner }) and
  window.slam.stop(). (winner is 1 for the challenger, 2 for the opponent; otherwise it's a coin flip.)
-->

<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%}

  #toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;z-index:30;padding:9px 14px 7px;font:700 16px/1.3 var(--txt);
    background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);

  /* ---------- host bar and the settings window (only visible while you interact with the source) ---------- */
  .btn{font:18px/1 var(--head);letter-spacing:.05em;padding:9px 14px 7px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);
    color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .06s}
  .btn:hover{transform:translate(-1px,-2px)}

  .btn.warn{background:var(--yellow)}
  #host{position:fixed;right:84px;bottom:22px;z-index:1000;display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:opacity .25s}
  body.mouse #host,#host:focus-within{opacity:1;pointer-events:auto}
  #host input{width:150px;font:700 16px var(--txt);padding:8px 10px;border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);outline:0}
  #host input:focus{border-color:var(--violet)}
  #host span{font:22px/1 var(--head);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
  #gear{position:fixed;right:20px;bottom:20px;width:50px;height:50px;z-index:1000;border:3px solid var(--ink);border-radius:50%;
    background:var(--sun);box-shadow:3px 3px 0 var(--ink);cursor:pointer;display:grid;place-items:center;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .2s}

  .sp-f{margin:0 0 12px}
  .sp-f:last-child{margin-bottom:0}
  .sp-f label{display:block;margin-bottom:4px}
  .sp-f input[type=text],.sp-f input[type=password],.sp-f input[type=number],.sp-f textarea,.sp-f select{width:100%;box-sizing:border-box;
    font:700 15px var(--txt);padding:7px 9px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
  .sp-f input:focus,.sp-f textarea:focus,.sp-f select:focus{outline:3px solid var(--cyan);outline-offset:1px}
  .sp-f input:disabled,.sp-f textarea:disabled,.sp-f select:disabled{background:#e8e6ef;color:#6a6278}
  .sp-f textarea{min-height:58px;resize:vertical}
  .sp-f small{display:block;margin-top:5px;font-size:13px;color:#4a4560}
  .sp-f small.url{color:#c2185b}
  .sp-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sp-row label{margin:0}
  .sw{position:relative;width:46px;height:24px;flex:none}
  .sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
  .sw i{position:absolute;inset:0;background:#d6d2e2;border:2px solid var(--ink);border-radius:20px}
  .sw i::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border:2px solid var(--ink);border-radius:50%;
    box-sizing:border-box;transition:transform .12s ease-out}
  .sw input:checked + i{background:var(--green)}

  .sp-foot .grow{flex:1}
  .sp-msg{font-size:14px;color:#c2185b;min-height:1em}

  @media (max-height:560px){
    #settings{align-items:flex-start}

    .sp-head p{display:none}
    .sp-body{overflow:visible}
  }
</style>

<body>
<canvas id="c"></canvas>
<div id="ui"><div id="bars"><div class="hp l"><b id="nA"></b><i><s id="hA"></s></i></div><em>VS</em><div class="hp r"><b id="nB"></b><i><s id="hB"></s></i></div></div>

<script type="module">
import * as THREE from 'three';

// ---------------- settings (saved locally; URL parameters override) ----------------
const Q = new URLSearchParams(location.search);
const STORE_KEY = 'slam.settings.v1';
let saved = {}, storageOK = true;
try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { storageOK = false; }
const FIELDS = [
  { sec: 'Chat' },
  { k: 'channel', label: 'Twitch channel', type: 'text', def: '', ph: 'yourchannel', help: 'Read anonymously, no login needed.' },
  { k: 'kick', label: 'Kick channel', type: 'text', def: '', ph: 'yourchannel', help: 'Read anonymously, no login needed.' },
  { k: 'tiktok', label: 'TikTok bridge', type: 'text', def: '', ph: '1 = TikFinity, or ws://…', help: 'TikTok needs a local bridge app. "1" uses TikFinity on this PC.' },
  { k: 'youtube', label: 'YouTube live', type: 'text', def: '', ph: 'video ID / link, or ws://…', help: 'A live video ID or link (needs the API key below), or a bridge address.' },
  { k: 'ytkey', label: 'YouTube API key', type: 'password', def: '', help: 'YouTube Data API v3 key from Google Cloud Console.' },
  { k: 'ytpoll', label: 'YouTube check every (s)', type: 'num', def: 6, min: 2, max: 60, step: 1, help: 'Lower = snappier, but uses the daily API quota faster.' },
  { k: 'demo', label: 'Demo chat', type: 'bool', def: false, help: 'Fake chatters wrestle every so often, for trying it out.' },
  { sec: 'Filtering' },
  { k: 'firsttime', label: 'Show first-time chatters', type: 'bool', def: false, help: 'Twitch flags these; spam bots usually show up this way.' },
  { k: 'botlist', label: 'Hide known bots', type: 'bool', def: true, help: 'Public TwitchInsights list (needs the overlay hosted, not a local file).' },
  { k: 'ignore', label: 'Always hide these users', type: 'area', def: 'nightbot, streamelements, streamlabs, moobot, fossabot, wizebot, soundalerts, sery_bot, kofistreambot, botrixoficial, commanderroot', help: 'Comma or line separated.' },
  { sec: 'Matches' },
  { k: 'cmd', label: 'Match command', type: 'text', def: '!wrestle', help: '"!wrestle somebody" starts a match with them, if they chatted in the last 10 minutes. On its own, it picks one of those.' },
  { k: 'cooldown', label: 'Cooldown (s)', type: 'num', def: 60, min: 0, max: 3600, step: 5, help: 'After a match, how long until the next one can start. The broadcaster skips it.' },
  { k: 'modskip', label: 'Mods skip the cooldown', type: 'bool', def: false },
  { k: 'who', label: 'Who can start one', type: 'select', def: 'everyone', opts: [['everyone', 'Everyone'], ['vips', 'Mods and VIPs'], ['mods', 'Mods'], ['owner', 'Only the broadcaster']],
    help: 'The broadcaster always can. VIPs are a Twitch and Kick thing.' },
  { k: 'pronouns', label: 'Looks by pronouns', type: 'bool', def: true,
    help: "Looks up Twitch chatters' pronouns (from the Chat Pronouns extension, pronouns.alejo.io) so she/her and he/him get a look to match; anyone else gets any look." },
  { k: 'allow', label: 'These people can too', type: 'text', def: '', ph: 'friend1, friend2', help: 'Names that can start a match whatever "Who can start one" says.' },
  { sec: 'Look' },
  { k: 'title', label: 'Show name (on the ring)', type: 'text', def: 'CHAT SLAM', help: 'Letters, numbers and spaces, up to 20.' },
  { k: 'layout', label: 'Where it shows', type: 'select', def: 'box', opts: [['box', 'A small box at the bottom centre'], ['wide', 'The whole screen']],
    help: 'The small box keeps everything in a little window along the bottom of the screen. The whole screen is bigger, with the sky and lights going right up to the top.' },
  { k: 'boxsize', label: 'Box width (% of the screen)', type: 'num', def: 40, min: 15, max: 100, step: 1, help: 'How wide the small box is.' },
  { k: 'pixel', label: 'Pixel size', type: 'num', def: 0, min: 0, max: 16, step: 1, help: 'Screen pixels per art pixel: bigger is chunkier. 0 = automatic (9 at 1080p, or whatever fills the small box).' },
  { k: 'hold', label: 'Winner stays up for (s)', type: 'num', def: 5, min: 1, max: 30, step: 0.5 },
  { k: 'volume', label: 'Sound effects volume', type: 'num', def: 50, min: 0, max: 100, step: 5, help: '0 = silent.' },
];
const FIELD = Object.fromEntries(FIELDS.filter(f => f.k).map(f => [f.k, f]));
function coerce(f, v) {
  if (f.type === 'bool') return v === true || v === 1 || /^(1|true|yes|on)$/i.test(String(v));
  if (f.type === 'num') { const n = parseFloat(v); return isNaN(n) ? f.def : Math.min(f.max, Math.max(f.min, n)); }
  if (f.type === 'select') return f.opts.some(o => o[0] === v) ? v : f.def;
  return String(v ?? '').trim();
}
const fromURL = {};
for (const f of Object.values(FIELD)) if (Q.has(f.k)) fromURL[f.k] = coerce(f, Q.get(f.k));
const SET = {};
for (const f of Object.values(FIELD)) SET[f.k] = f.k in fromURL ? fromURL[f.k] : f.k in saved ? coerce(f, saved[f.k]) : f.def;
const CFG = {
  ...SET,
  channel: SET.channel.replace(/^.*twitch\.tv\//i, '').replace(/^#/, '').replace(/[/?#].*$/, '').toLowerCase(),
  kick: SET.kick.replace(/^.*kick\.com\//i, '').replace(/[/?#].*$/, '').toLowerCase(),
  tiktok: SET.tiktok === '1' ? 'ws://localhost:21213/' : SET.tiktok,
  cmd: (SET.cmd || '!wrestle').toLowerCase().split(/\s+/)[0],
};
const ALLOW = new Set(CFG.allow.toLowerCase().split(/[\s,]+/).map(s => s.replace(/^@/, '')).filter(Boolean));

// Preview background outside OBS so you can actually see it in a browser
const bgq = Q.get('bg');
if (bgq && bgq !== 'none') document.body.style.background = bgq;
else if (!bgq && !window.obsstudio) document.body.style.background = '#1a0f33';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
let toastT;
function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3500);
}

// ---------------- random numbers ----------------
function hash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const hash3 = (a, b, c) => ((Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663) ^ Math.imul(c | 0, 83492791)) >>> 0) % 1000003;
function rngOf(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
let rnd = rngOf(Date.now());
const pick = (a, r = rnd) => a[Math.floor(r() * a.length)];
const range = (a, b, r = rnd) => a + (b - a) * r();
function shuffle(a, r) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function noise2(x, y, seed) {
  const h = (i, j) => (Math.imul(Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ seed, 1274126177) >>> 16) / 65535;
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(h(xi, yi), h(xi + 1, yi), u), lerp(h(xi, yi + 1), h(xi + 1, yi + 1), u), v);
}

// ---------------- colors ----------------
const _hsl = {}, adjCache = new Map();
// lighten / saturate / turn a CSS color, in sRGB
function adj(css, dl = 0, ds = 0, dh = 0) {
  dl = Math.round(dl * 100) / 100;
  const k = css + '|' + dl + '|' + ds + '|' + dh;
  let v = adjCache.get(k);
  if (v) return v;
  const c = new THREE.Color(css); c.getHSL(_hsl, THREE.SRGBColorSpace);
  c.setHSL((_hsl.h + dh + 1) % 1, clamp(_hsl.s + ds, 0, 1), clamp(_hsl.l + dl, 0, 1), THREE.SRGBColorSpace);
  adjCache.set(k, v = '#' + c.getHexString(THREE.SRGBColorSpace));
  return v;
}
// A chatter's color, kept bright enough to show up; chatters without one get a color of their own from their name.
function shirtOf(name, color) {
  const c = /^#?[0-9a-f]{6}$/i.test(color || '') ? new THREE.Color(color[0] === '#' ? color : '#' + color) : null;
  if (c) {
    c.getHSL(_hsl, THREE.SRGBColorSpace);
    c.setHSL(_hsl.h, clamp(_hsl.s, .45, .9), clamp(_hsl.l, .42, .62), THREE.SRGBColorSpace);
    return '#' + c.getHexString(THREE.SRGBColorSpace);
  }
  const h = hash(name.toLowerCase());
  return cssOf(`hsl(${h % 360},${65 + (h >>> 9) % 25}%,${48 + (h >>> 14) % 10}%)`);
}
const cssOf = c => '#' + new THREE.Color(c).getHexString(THREE.SRGBColorSpace);

// ---------------- voxels ----------------
// Each face: its normal, its corners (counter-clockwise from outside) and its light. The sun is setting behind

// Twitch chatters' pronouns from the Chat Pronouns extension's public database (pronouns.alejo.io). She/her and
// he/him get looks to match; everyone else (or anyone who hasn't set them) any look.
const PRONOUNS = { hehim: 'he', sheher: 'she', theythem: 'they', shethey: 'she', hethey: 'he', heshe: 'he', xexem: 'xe', faefaer: 'fae',
  vever: 've', aeaer: 'ae', ziehir: 'zie', perper: 'per', itits: 'it', eem: 'e', any: 'any', other: 'other', ask: 'ask', avoid: 'avoid' };

  if (!pronounCache.has(k)) pronounCache.set(k, (async () => {

// The match, decided before it starts: a few moves each (the loser gets a comeback), a near fall or two, and the

  }

// ---------------- a match ----------------
let busy = false, lastEnd = -Infinity;
async function match(A, B, winner) {

  layout();

  world = new THREE.Group(); scene.add(world);
  stage = billboard(0, FIGHT_Z[0], RH);
  stage.root.updateMatrixWorld(true);
  partMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial(), MAXP);
  geos.push(partMesh.geometry);

  canvas.classList.add('on');

  banner(TITLE + '!', `${A.name} vs ${B.name}`);
  sfx('cheer'); hype = 1.5;
  const [pA, pB] = await Promise.race([prons, new Promise(res => setTimeout(() => res([null, null]), 1500))]);
  await wait(1.4); if (!alive()) return;

  // in they come, from the red corner and the blue corner, over the top rope
  const style = (p, who) => who.plat === 'demo' ? pick(['boy', 'girl', 'any']) : styleOf(p);
  const lookA = wrestlerLook(A, style(pA, A)), lookB = wrestlerLook(B, style(pB, B), lookA.pal.A);
  const wA = makeWrestler(A, lookA, -W / 2 - 12, FIGHT_Z[0]), wB = makeWrestler(B, lookB, W / 2 + 12, FIGHT_Z[1]);
  wA.side = -1; wB.side = 1;
  $('nA').textContent = A.name; $('nB').textContent = B.name;
  $('nA').style.setProperty('--c', lookA.pal.C); $('nB').style.setProperty('--c', lookB.pal.C);
  setBar(wA); setBar(wB);
  bannerOff();

    await runTo(w, s * (RW + 9), 95);

    faceTo(w, 0); w.pose = 'flex'; w.setFace('happy'); sfx('cheer'); hype += .8;
    await wait(.6);

    a.setFace('fight'); a.pose = 'guard';

    }
  }
  if (!alive()) return;

  // the winner gets the belt; the loser lies there seeing stars
  await wait(.4); if (!alive()) return;
  win.onTop = false;
  await getUp(win, lose); if (!alive()) return;
  turn(win, 0, .3);
  win.pose = 'belt'; win.setFace('happy');
  const bg = new THREE.Group(); bg.position.set(0, 20, 2); win.inner.add(bg);
  const belt = new THREE.Mesh(beltVB().geo(), MAT); bg.add(belt); outlined(belt);
  prop(bg, { dur: .4 }); sfx('pop');
  lose.setFace('dazed'); lose.pose = 'dazed';
  for (let i = 0; i < 3; i++) spawn(0, 0, 0, 0, 'star', { w: lose, ph: i * 2.1, life: 60, col: '#ffe14a' });
  const L = lose.who.name, their = theirOf(lose === wA ? pB : pA);
  banner(win.who.name, pick([`${L} is seeing stars!`, `${L} needs a nap!`, `What a match! ${L} gave it ${their} all!`, `${L} is down for the count!`]), win.look.pal.C);
  sfx('win'); sfx('cheer'); hype = 4;
  for (let i = 0; i < 140; i++) spawn(range(-RW, RW), range(40, 90), range(-15, 15), range(-10, 20), 'confetti', { g: 14, life: range(2.5, 5), col: pick(CONFETTI) });
  await wait(CFG.hold); if (!alive()) return;

  // everything shrinks away: the people first, then the ring, the crowd and the lights, the floor last
  bannerOff(); $('bars').classList.remove('on');
  for (const w of wrestlers) w.prop.twist = pick([-1.3, 1.3]);
  parts = parts.filter(p => p.kind !== 'star');
  shrinkAll(p => wrestlers.some(w => w.prop === p) || p.obj === bg ? r() * .15 : p.ground && p.obj.parent === world && !p.apply ? .55 + r() * .4 : .2 + r() * .4);
  await wait(1.6); if (!alive()) return;
  teardown();
  lastEnd = performance.now();
  busy = false;
  if (CFG.demo) setTimeout(runDemoMatch, 2500);
}

function teardown() {
  run++;
  tasks.clear();
  cancelFrame(raf); running = false;
  if (world) scene.remove(world);
  for (const b of beams) { b.tex.dispose(); b.mat.dispose(); }
  for (const g of geos) g.dispose();
  geos = []; props = []; wrestlers = []; crowd = []; flashes = []; beams = []; parts = [];
  world = stage = ref = partMesh = null;
  hype = 0; shake = 0; camera.position.x = camX;
  renderer.clear();
  canvas.classList.remove('on');
  $('bars').classList.remove('on');
  $('ban').classList.remove('on', 'off');
  for (const el of document.querySelectorAll('.pow')) el.remove();
}

// ---------------- who's wrestling who ----------------
const RECENT_MS = 10 * 60000;
const recent = new Map();   // chatters seen, lower-case name → { name, color, login, plat, at }
function remember(name, color, login, plat) {
  const k = name.toLowerCase();
  recent.delete(k); recent.set(k, { name, color, login: login || name, plat, at: performance.now() });
  if (recent.size > 500) recent.delete(recent.keys().next().value);
}
const cleanName = s => String(s || '').trim().split(/\s+/)[0].replace(/^@+/, '').replace(/[^\p{L}\p{N}_.-]/gu, '').slice(0, 25);
// returns why it didn't start, or '' if it did
function challenge(from, fromColor, arg, { owner = false, mod = false, force = false, winner, login, plat = 'custom' } = {}) {
  if (busy) return 'busy';
  const left = CFG.cooldown * 1000 - (performance.now() - lastEnd);
  if (left > 0 && !force && !owner && !(mod && CFG.modskip)) return 'cooldown';
  // you can only wrestle someone who has chatted in the last 10 minutes (the host bar and window.slam can pick anyone)
  const me = from.toLowerCase(), live = c => c && performance.now() - c.at < RECENT_MS;
  let target = cleanName(arg), info = null;
  if (!target) {
    const pool = [...recent.values()].filter(c => c.name.toLowerCase() !== me && live(c));
    if (!pool.length) return 'nobody';
    info = pick(pool);
  } else {
    if (target.toLowerCase() === me) return 'self';
    info = recent.get(target.toLowerCase());
    if (!live(info) && !force) return 'unseen';
  }
  match({ name: from, color: fromColor, login: login || from, plat },
    { name: info?.name || target, color: info?.color, login: info?.login || target, plat: info?.plat || plat }, winner);
  return '';
}
function stop() { if (busy) { teardown(); busy = false; lastEnd = performance.now(); } }
window.slam = {
  start: (a, b, o = {}) => challenge(cleanName(a) || 'Stranger', o.color, b, { force: true, winner: o.winner }),
  stop,
};

// ---------------- chat ----------------
// ---------------- who's left out ----------------
// The "ignore" names, plus (with "Hide known bots") the ~1k known bot accounts on the public TwitchInsights
// list. If that can't be reached (offline, blocked, or the overlay opened as a local file), it's just the names.
const IGNORE = new Set(CFG.ignore.toLowerCase().split(/[\s,]+/).map(s => s.replace(/^@/, '')).filter(Boolean));
async function loadBotList() {
  try {
    const r = await fetch('https://api.twitchinsights.net/v1/bots/all', { cache: 'no-store' });
    const j = await r.json();
    (j.bots || []).forEach(b => { const name = Array.isArray(b) ? b[0] : b; if (name) IGNORE.add(String(name).toLowerCase()); });
  } catch (e) {
    console.warn('known-bot list unavailable, using ignore= only', e);
  }
  setTimeout(loadBotList, 6 * 3600 * 1000); // refresh every 6 hours
}
if (CFG.botlist) loadBotList();

function handleChat({ name, text, platform = 'custom', owner = false, mod = false, vip = false, color, login }) {
  if (!name || IGNORE.has(String(name).toLowerCase())) return;
  const plain = (text || '').replace(/^\x01ACTION |\x01$/g, '').trim(), cmd = plain.split(/\s+/)[0].toLowerCase(), arg = plain.slice(cmd.length).trim();
  if (platform !== 'demo') remember(name, color, login, platform);
  if (cmd !== CFG.cmd) return;
  const ok = owner || ALLOW.has(String(name).toLowerCase()) || CFG.who === 'everyone' || (CFG.who === 'mods' && mod) || (CFG.who === 'vips' && (mod || vip));
  if (ok) challenge(name, color, arg, { owner, mod, login, plat: platform });
}

// ---------------- Twitch (anonymous IRC over WebSocket) ----------------
function parseTags(raw) {
  const o = {};
  const un = v => v.replace(/\\(.)/g, (_, c) => ({ s: ' ', ':': ';', '\\': '\\', r: '\r', n: '\n' }[c] ?? c));
  raw.split(';').forEach(kv => { const i = kv.indexOf('='); o[kv.slice(0, i)] = un(kv.slice(i + 1)); });
  return o;
}
function connectTwitch(channel) {
  const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen = () => {
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('PASS SCHMOOPIIE');
    ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 80000));
    ws.send('JOIN #' + channel);
  };
  ws.onmessage = (ev) => {
    for (const line of ev.data.split('\r\n')) {
      if (!line) continue;
      if (line.startsWith('PING')) { ws.send('PONG :tmi.twitch.tv'); continue; }
      const m = /^(?:@(\S+) )?:([^!\s]+)![^ ]+ PRIVMSG #\S+ :(.*)$/.exec(line);
      if (!m) continue;
      const tags = m[1] ? parseTags(m[1]) : {}, badges = tags.badges || '';
      if (tags['first-msg'] === '1' && !CFG.firsttime) continue;
      handleChat({ name: tags['display-name'] || m[2], login: m[2], text: m[3], platform: 'twitch', color: tags.color,
        owner: /(^|,)broadcaster\//.test(badges) || m[2] === channel,
        mod: tags.mod === '1' || /(^|,)moderator\//.test(badges),
        vip: tags.vip === '1' || /(^|,)vip\//.test(badges) });
    }
  };
  ws.onclose = () => setTimeout(() => connectTwitch(channel), 3000);
}

// ---------------- Kick (anonymous, Kick's public Pusher chat socket) ----------------
const KICK_PUSHER = 'wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=8.4.0&flash=false';
async function connectKick(slug) {
  let chatroom;
  try {
    const r = await fetch(`https://kick.com/api/v2/channels/${encodeURIComponent(slug)}`);
    chatroom = (await r.json()).chatroom?.id;
    if (!chatroom) throw new Error('no chatroom');
  } catch (e) { console.warn('[slam] Kick channel lookup failed for', slug, e); return setTimeout(() => connectKick(slug), 30000); }
  kickSocket(chatroom);
}
function kickSocket(chatroom) {
  const ws = new WebSocket(KICK_PUSHER);
  ws.onmessage = (ev) => {
    let o; try { o = JSON.parse(ev.data); } catch { return; }
    if (o.event === 'pusher:connection_established') {
      ws.send(JSON.stringify({ event: 'pusher:subscribe', data: { auth: '', channel: `chatrooms.${chatroom}.v2` } }));
      return;
    }
    if (o.event === 'pusher:ping') { ws.send(JSON.stringify({ event: 'pusher:pong', data: {} })); return; }
    let d; try { d = typeof o.data === 'string' ? JSON.parse(o.data) : o.data; } catch { return; }
    if (!d || String(o.event).split('\\').pop() !== 'ChatMessageEvent') return;
    const s = d.sender || {}, badges = (s.identity?.badges || []).map(b => b.type);
    handleChat({ name: s.username, text: (d.content || '').replace(/\[emote:\d+:([^\]]+)\]/g, '$1'), platform: 'kick', color: s.identity?.color,
      owner: badges.includes('broadcaster') || String(s.slug || s.username || '').toLowerCase() === CFG.kick,
      mod: badges.includes('moderator'), vip: badges.includes('vip') });
  };
  ws.onclose = () => setTimeout(() => kickSocket(chatroom), 3000);
  ws.onerror = () => {};
}

// ---------------- WebSocket bridges (TikFinity for TikTok, or any bridge for YouTube) ----------------
function connectBridge(url, platform) {
  let ws;
  try { ws = new WebSocket(url); } catch (e) { return setTimeout(() => connectBridge(url, platform), 5000); }
  ws.onmessage = (ev) => {
    let o; try { o = JSON.parse(ev.data); } catch { return; }
    const type = (o.event || o.type || '').toString().toLowerCase(), d = o.data || o;
    if (type && !['chat', 'comment', 'message', 'chatmessage'].includes(type)) return;
    const name = d.nickname || d.uniqueId || d.displayName || d.chatname || d.user?.nickname || d.user?.uniqueId || d.user?.name || d.username;
    const text = d.comment || d.message || d.text || d.chatmessage;
    if (name && typeof text === 'string')
      handleChat({ name, text, platform, owner: !!(d.isOwner || d.isStreamer || d.isBroadcaster || d.isChatOwner),
        mod: !!(d.isModerator || d.isMod || d.isChatModerator) });
  };
  ws.onclose = () => setTimeout(() => connectBridge(url, platform), 3000);
  ws.onerror = () => {};
}

// ---------------- YouTube (Data API v3 polling) ----------------
async function connectYouTube(videoId, key) {
  const API = 'https://www.googleapis.com/youtube/v3/';
  const retry = () => setTimeout(() => connectYouTube(videoId, key), 30000);
  let chatId;
  try {
    const r = await fetch(`${API}videos?part=liveStreamingDetails&id=${encodeURIComponent(videoId)}&key=${encodeURIComponent(key)}`);
    chatId = (await r.json()).items?.[0]?.liveStreamingDetails?.activeLiveChatId;
    if (!chatId) { console.warn('[slam] YouTube: no active live chat for', videoId); return retry(); }
  } catch (e) { return retry(); }
  let pageToken = '', first = true;
  const poll = async () => {
    let wait = CFG.ytpoll * 1000;
    try {
      const r = await fetch(`${API}liveChat/messages?liveChatId=${encodeURIComponent(chatId)}&part=snippet,authorDetails&maxResults=200&key=${encodeURIComponent(key)}${pageToken ? '&pageToken=' + pageToken : ''}`);
      const j = await r.json();
      if (j.error) { if (r.status === 403 || r.status === 404) return retry(); wait = 15000; }
      else {
        pageToken = j.nextPageToken || pageToken;
        wait = Math.max(wait, j.pollingIntervalMillis || 0);
        // (the backlog from before connecting is skipped)
        if (!first) for (const it of j.items || []) if (it.snippet?.displayMessage)
          handleChat({ name: it.authorDetails?.displayName, text: it.snippet.displayMessage, platform: 'youtube',
            owner: !!it.authorDetails?.isChatOwner, mod: !!it.authorDetails?.isChatModerator });
        first = false;
      }
    } catch (e) { wait = 15000; }
    setTimeout(poll, wait);
  };
  poll();
}
const ytId = (v) => (/(?:v=|youtu\.be\/|live\/)([\w-]{11})/.exec(v) || [])[1] || v;

// ---------------- demo chat ----------------
const DEMO = [['MachoMarco', '#ff7f50'], ['LilSuplex', '#9acd32'], ['TheIronMaiden', '#1e90ff'], ['CaptainClothesline', '#ff69b4'],
  ['RowdyRhonda', '#daa520'], ['TurboTina', '#8a2be2'], ['ElPollo', '#00ff7f'], ['BigDaddyBytes', '#ff4500']];
function runDemoMatch() {
  if (busy) return;
  const a = pick(DEMO); let b = pick(DEMO);
  while (b === a) b = pick(DEMO);
  remember(b[0], b[1], b[0], 'demo');
  handleChat({ name: a[0], color: a[1], text: CFG.cmd + ' @' + b[0], platform: 'demo', owner: true });
}

// ---------------- host bar and settings window ----------------
const hostEl = document.createElement('form');
hostEl.id = 'host';
hostEl.innerHTML = `<input name="a" placeholder="challenger" spellcheck="false" autocomplete="off"><span>vs</span><input name="b" placeholder="opponent" spellcheck="false" autocomplete="off"><button class="btn go">Fight!</button><button class="btn" type="button" data-h="stop">Stop</button>`;
document.body.appendChild(hostEl);
hostEl.addEventListener('submit', e => {
  e.preventDefault();
  const a = cleanName(hostEl.a.value) || CFG.channel || CFG.kick || 'You', b = cleanName(hostEl.b.value) || pick(DEMO)[0];
  const why = challenge(a, recent.get(a.toLowerCase())?.color, b, { force: true });
  if (why === 'busy') toast('A match is already on — Stop ends it');
  else if (why === 'self') toast('Pick two different names');
});
hostEl.addEventListener('click', e => { if (e.target.dataset?.h === 'stop') stop(); });

// Open it from OBS: right-click the source → Interact, move the mouse, click the gear.
(function settingsUI() {
  const gear = document.createElement('button');
  gear.id = 'gear'; gear.title = 'Chat Slam settings';
  gear.innerHTML = `<svg viewBox="0 0 24 24" fill="#fff" stroke="#111" stroke-width="1.8" stroke-linejoin="round"><path d="M10.3 2h3.4l.5 2.6 1.9.8 2.2-1.5 2.4 2.4-1.5 2.2.8 1.9 2.6.5v3.4l-2.6.5-.8 1.9 1.5 2.2-2.4 2.4-2.2-1.5-1.9.8-.5 2.6h-3.4l-.5-2.6-1.9-.8-2.2 1.5-2.4-2.4 1.5-2.2-.8-1.9L2 13.7v-3.4l2.6-.5.8-1.9-1.5-2.2 2.4-2.4 2.2 1.5 1.9-.8z"/><circle cx="12" cy="12" r="3.2" fill="#ffe600"/></svg>`;
  document.body.appendChild(gear);

  const panel = document.createElement('div');
  panel.id = 'settings';
  panel.innerHTML = `<div class="sp" role="dialog" aria-label="Chat Slam settings">
    <div class="sp-head"><h2>Chat Slam — Settings</h2>
      <p>Saved in this browser source and applied when you press <b>Save &amp; apply</b>. Heads up: this window shows on stream while it's open.</p></div>
    <div class="sp-body"></div>
    <div class="sp-foot">
      <button class="btn" data-act="test">Test match</button>
      <button class="btn" data-act="link">Copy setup link</button>
      <button class="btn warn" data-act="defaults">Defaults</button>
      <span class="sp-msg grow"></span>
      <button class="btn" data-act="close">Cancel</button>
      <button class="btn go" data-act="save">Save &amp; apply</button>
      <input class="sp-link" readonly>
    </div></div>`;
  document.body.appendChild(panel);
  const body = panel.querySelector('.sp-body'), msg = panel.querySelector('.sp-msg'), linkBox = panel.querySelector('.sp-link');
  const inputs = {};

  let sec = null;
  for (const f of FIELDS) {
    if (f.sec) {
      sec = document.createElement('div'); sec.className = 'sp-sec';
      const h = document.createElement('h3'); h.textContent = f.sec; sec.appendChild(h);
      body.appendChild(sec); continue;
    }
    const wrapF = document.createElement('div'); wrapF.className = 'sp-f';
    const id = 'sp-' + f.k;
    const lab = document.createElement('label'); lab.htmlFor = id; lab.textContent = f.label;
    let inp;
    if (f.type === 'bool') {
      const row = document.createElement('div'); row.className = 'sp-row';
      const sw = document.createElement('span'); sw.className = 'sw';
      inp = document.createElement('input'); inp.type = 'checkbox';
      sw.append(inp, document.createElement('i'));
      row.append(lab, sw); wrapF.appendChild(row);
    } else if (f.type === 'select') {
      inp = document.createElement('select');
      for (const [v, t] of f.opts) { const o = document.createElement('option'); o.value = v; o.textContent = t; inp.appendChild(o); }
      wrapF.append(lab, inp);
    } else {
      inp = document.createElement(f.type === 'area' ? 'textarea' : 'input');
      if (f.type !== 'area') inp.type = f.type === 'num' ? 'number' : f.type;
      if (f.type === 'num') { inp.min = f.min; inp.max = f.max; inp.step = f.step; }
      if (f.ph) inp.placeholder = f.ph;
      inp.spellcheck = false; inp.autocomplete = 'off';
      wrapF.append(lab, inp);
    }
    inp.id = id;
    if (f.help) { const sm = document.createElement('small'); sm.textContent = f.help; wrapF.appendChild(sm); }
    if (f.k in fromURL) {
      inp.disabled = true;
      const sm = document.createElement('small'); sm.className = 'url';
      sm.textContent = 'Set by the source URL, which overrides this.';
      wrapF.appendChild(sm);
    }
    inputs[f.k] = inp;
    sec.appendChild(wrapF);
  }

  const fill = (vals) => {
    for (const [k, inp] of Object.entries(inputs)) {
      const v = vals[k];
      if (FIELD[k].type === 'bool') inp.checked = !!v; else inp.value = v;
    }
  };
  const read = () => {
    const out = {};
    for (const [k, inp] of Object.entries(inputs)) out[k] = coerce(FIELD[k], FIELD[k].type === 'bool' ? inp.checked : inp.value);
    return out;
  };
  const open = () => {
    fill(SET);
    msg.textContent = storageOK ? '' : 'This browser source can\'t save settings — use "Copy setup link" instead.';
    linkBox.style.display = 'none';
    panel.classList.add('open');
  };
  const close = () => panel.classList.remove('open');

  gear.addEventListener('click', open);
  panel.addEventListener('mousedown', e => { if (e.target === panel) close(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  panel.querySelector('.sp-foot').addEventListener('click', e => {
    const act = e.target.dataset && e.target.dataset.act;
    if (!act) return;
    if (act === 'close') close();
    if (act === 'test') {
      const vals = read();
      stop();
      challenge(vals.channel || vals.kick || 'You', null, pick(DEMO)[0], { force: true });
      close();
    }
    if (act === 'defaults') {
      const d = {}; for (const f of Object.values(FIELD)) d[f.k] = f.def;
      fill(d); msg.textContent = 'Defaults filled in — press Save & apply to keep them.';
    }
    if (act === 'link') {
      const vals = read(), q = new URLSearchParams();
      for (const f of Object.values(FIELD)) {
        const v = vals[f.k];
        if (v === f.def) continue;
        q.set(f.k, f.type === 'bool' ? (v ? '1' : '0') : String(v));
      }
      const link = location.href.split(/[?#]/)[0] + (q.toString() ? '?' + q.toString() : '');
      linkBox.value = link; linkBox.style.display = 'block'; linkBox.select();
      const done = () => { msg.textContent = 'Setup link copied' + (vals.ytkey ? ' (it includes your YouTube API key — keep it private).' : '.'); };
      try { navigator.clipboard.writeText(link).then(done, () => { document.execCommand('copy'); done(); }); }
      catch (err) { try { document.execCommand('copy'); done(); } catch (e2) { msg.textContent = 'Copy the link from the box below.'; } }
    }
    if (act === 'save') {
      try {
        const vals = read();
        // fields locked by the URL keep whatever was saved before (the URL value isn't a choice made here)
        for (const k in fromURL) { if (k in saved) vals[k] = coerce(FIELD[k], saved[k]); else delete vals[k]; }
        localStorage.setItem(STORE_KEY, JSON.stringify(vals));
        msg.textContent = 'Saved! Reloading…';
        setTimeout(() => location.reload(), 250);
      } catch (err) {
        msg.textContent = 'Couldn\'t save here — use "Copy setup link" and paste it as the source URL.';
      }
    }
  });

  // the buttons only appear while a mouse is over the overlay (i.e. in OBS's Interact window)
  let mt;
  addEventListener('mousemove', () => {
    document.body.classList.add('mouse');
    clearTimeout(mt); mt = setTimeout(() => document.body.classList.remove('mouse'), 3000);
  });
  document.addEventListener('mouseleave', () => document.body.classList.remove('mouse'));
})();

layout();
addEventListener('resize', () => { if (!busy) layout(); });
if (CFG.channel) connectTwitch(CFG.channel);
if (CFG.kick) connectKick(CFG.kick);
if (CFG.tiktok) connectBridge(CFG.tiktok, 'tiktok');
if (CFG.youtube) {
  if (/^wss?:\/\//i.test(CFG.youtube)) connectBridge(CFG.youtube, 'youtube');
  else if (CFG.ytkey) connectYouTube(ytId(CFG.youtube), CFG.ytkey);
  else console.warn('[slam] youtube= needs ytkey= (or a ws:// bridge URL)');
}
if (CFG.demo) setTimeout(runDemoMatch, 800);
if (!CFG.channel && !CFG.kick && !CFG.tiktok && !CFG.youtube && !CFG.demo)
  toast('No chat connected yet: move the mouse over the overlay and click the gear, or add ?channel=yourchannel');
</script>
